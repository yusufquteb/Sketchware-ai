name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Set up Android SDK path
      run: echo "sdk.dir=$ANDROID_HOME" > local.properties

    - name: Accept Android SDK licenses and install platform 36
      run: |
        SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name "sdkmanager" -type f 2>/dev/null | head -1)
        if [ -z "$SDKMANAGER" ]; then
          SDKMANAGER=$(which sdkmanager 2>/dev/null || echo "")
        fi
        if [ -z "$SDKMANAGER" ]; then
          echo "sdkmanager not found — skipping SDK install, relying on pre-installed SDK"
        else
          echo "Using sdkmanager at: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" || true
        fi

    - name: Generate test keystore
      run: |
        keytool -genkey -v \
          -keystore testkey.keystore \
          -alias testkey \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass testkey \
          -keypass testkey \
          -dname "CN=Test,OU=Test,O=Test,L=Test,S=Test,C=US"

    - name: Build debug (android26)
      run: ./gradlew assembleAndroid26Debug --stacktrace 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

    - name: Upload build log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        retention-days: 3

    - name: Post build error to PR
      if: failure() && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          let log = '';
          try { log = fs.readFileSync('build.log', 'utf8'); } catch(e) { log = 'build.log not found'; }
          const lines = log.split('\n');
          const errorStart = lines.findIndex(l => /FAILURE|error:|Error |Exception/.test(l));
          const snippet = errorStart >= 0
            ? lines.slice(Math.max(0, errorStart - 5), errorStart + 60).join('\n')
            : lines.slice(-80).join('\n');
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: `### Build failure log\n\`\`\`\n${snippet.slice(0, 8000)}\n\`\`\``
          });
