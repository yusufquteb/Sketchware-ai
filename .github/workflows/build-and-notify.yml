name: Build Debug APK and Notify Telegram

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate APK
        id: locate_apk
        run: |
          APK_PATH=$(find . -type f -name "*debug*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found!"
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "apk_name=$(basename $APK_PATH)" >> "$GITHUB_OUTPUT"
          echo "Found APK at: $APK_PATH"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: ${{ steps.locate_apk.outputs.apk_path }}
          retention-days: 7

      - name: Build update description
        id: build_desc
        run: |
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          COMMIT_HASH=$(git rev-parse --short HEAD)
          BRANCH="${{ github.ref_name }}"
          ACTOR="${{ github.actor }}"
          
          # Build the message
          MESSAGE="✅ *Build Succeeded*%0A%0A"
          MESSAGE="${MESSAGE}📦 APK: \`${{ steps.locate_apk.outputs.apk_name }}\`%0A"
          MESSAGE="${MESSAGE}🔗 Branch: \`${BRANCH}\`%0A"
          MESSAGE="${MESSAGE}👤 By: ${ACTOR}%0A"
          MESSAGE="${MESSAGE}🔖 Commit: \`${COMMIT_HASH}\`%0A%0A"
          MESSAGE="${MESSAGE}📝 Message: ${COMMIT_MSG}%0A%0A"
          MESSAGE="${MESSAGE}⬇️ Download from GitHub Actions artifacts (expires in 7 days)"
          
          echo "message=${MESSAGE}" >> "$GITHUB_OUTPUT"

      - name: Send notification to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=${{ steps.build_desc.outputs.message }}" \
            -d "parse_mode=Markdown"

      - name: Notify Telegram on failure
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          LOGS_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MESSAGE="❌ *Build Failed*%0A%0A"
          MESSAGE="${MESSAGE}🔗 Branch: ${{ github.ref_name }}%0A"
          MESSAGE="${MESSAGE}👤 By: ${{ github.actor }}%0A%0A"
          MESSAGE="${MESSAGE}📋 View logs: ${LOGS_URL}"
          
          curl -sS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=Markdown"
