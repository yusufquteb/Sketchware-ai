        exclude group: "com.google.guava", module: "guava"
    }

    // Analytics and Crashlytics
    if (analyticsEnabled) {
        new File("$projectDir/google-services.json").text = secrets
    }
    implementation platform("com.google.firebase:firebase-bom:34.9.0")
    implementation "com.google.firebase:firebase-crashlytics"
    implementation "com.google.firebase:firebase-analytics"
    implementation "com.google.firebase:firebase-messaging"

    // NOTE: switched from desugar_jdk_libs_nio to the full desugar_jdk_libs.
    // The "_nio" variant only backports java.nio.file.* APIs. It does NOT cover
    // InputStream.readAllBytes() (added in Java 9, part of java.io, not java.nio),
    // which caused a runtime NoSuchMethodError on devices below API 33/34 (and inside
    // the isolated ECJCompilerService process, which runs the bundled ECJ compiler
    // library that internally calls InputStream.readAllBytes()). The full artifact
    // backports java.io/java.util/java.time/java.nio APIs and fixes this class of crash.
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"

    // Additional project workflow dependencies
    implementation "net.lingala.zip4j:zip4j:2.11.5"
    implementation "org.eclipse.jgit:org.eclipse.jgit:7.3.0.202506031305-r"

    // ── Offline AI Models (on-device inference via llama.cpp) ──
