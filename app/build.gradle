android {
    compileSdk = 36

    def gitCommitHash = "git rev-parse HEAD".execute().text.trim()
    def shortCommitHash = "git rev-parse --short HEAD".execute().text.trim()

    defaultConfig {
        applicationId = "pro.sketchware"
        namespace = "pro.sketchware"
        //noinspection ExpiredTargetSdkVersion since we don't target getting Sketchware Pro on Google Play.
        targetSdk = 28
        minSdk = 26
        versionCode = 151
        versionName = "v8.0.0-${shortCommitHash}"

        buildConfigField("String", "GIT_HASH", "\"${gitCommitHash}\"")

    }

    signingConfigs {
        debug {
            def keystoreFile = file("../testkey.keystore")
            if (keystoreFile.exists()) {
                storeFile = keystoreFile
                storePassword = "testkey"
                keyAlias = "testkey"
                keyPassword = "testkey"
            }
            // If testkey.keystore is absent (local build), Android falls back
            // to the default debug keystore (~/.android/debug.keystore).
        }
        // NOTE: there is currently no dedicated release signing config. The
        // "release" build type below is signed with signingConfigs.debug,
        // meaning a "release" APK from this project is not actually signed
        // for distribution -- it uses the same debug-only key as every other
        // debug build on this machine. For a real final/distributable build,
        // generate your own keystore (keytool -genkeypair ...), keep it and
        // its passwords OUT of version control, and add a release {} block
        // here pointing to it. Nothing here can safely do that for you, since
        // it involves a private key only you should hold.
    }

    splits {
        // ABI splits: produces one smaller APK per CPU architecture instead
        // of a single APK bundling all four. This project links native code
        // through libsu, R8/D8, and other dependencies, so native .so files
        // for every ABI are a meaningful share of the current APK size.
        // Whoever installs a split APK must pick the one matching their
        // device's architecture (arm64-v8a covers the overwhelming majority
        // of modern Android devices; armeabi-v7a covers older/32-bit ones).
        abi {
            enable true
            reset()
            include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            universalApk true // also produce one fallback APK with all ABIs
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            shrinkResources = false
            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
            signingConfig = signingConfigs.debug
        }
        debug {
            minifyEnabled = false
            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
        }
    }

    packagingOptions {
        resources.excludes += "license/*"
        resources.excludes += "META-INF/DEPENDENCIES"
        resources.pickFirsts += "api_database/*"

        // Safe size reduction: strip duplicate/unused metadata that many
        // transitive dependencies bundle (license text, module descriptors,
        // notice files). None of this is read at runtime; it's purely
        // packaging noise duplicated across dozens of jars. This is a
        // well-established, low-risk exclusion list (unlike touching code
        // shrinking, which isn't in scope here).
        resources.excludes += "META-INF/LICENSE*"
        resources.excludes += "META-INF/NOTICE*"
        resources.excludes += "META-INF/*.kotlin_module"
        resources.excludes += "META-INF/*.version"
        resources.excludes += "META-INF/proguard/*"
        resources.excludes += "META-INF/INDEX.LIST"
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    androidResources {
        additionalParameters.addAll("--stable-ids", "${rootDir}/public-stable-ids.txt")
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
        resValues = true
    }

    configurations.implementation {
        exclude group: 'javax.inject', module: 'javax.inject'
        exclude group: "org.jetbrains.kotlin", module: "kotlin-scripting-compiler-embeddable"
        exclude group: "org.jetbrains.kotlin", module: "kotlin-scripting-common"
        exclude group: "org.jetbrains.kotlin", module: "kotlin-scripting-jvm"
        exclude group: "org.jetbrains.kotlin", module: "kotlin-script-runtime"
    }

    flavorDimensions "default"
    productFlavors {
        android26 {
            versionName "v8.0.0-${shortCommitHash}"
            dimension "default"
            resValue "integer", "for_min_sdk", "26"
            resValue "bool", "enable_relase_app", "true"
            resValue "bool", "enable_r8", "true"
        }
        android33 {
            versionName "v8.0.0-${shortCommitHash}"
            dimension "default"
            resValue "integer", "for_min_sdk", "33"
            resValue "bool", "enable_relase_app", "true"
            resValue "bool", "enable_r8", "true"
        }
    }
}

androidComponents {
    onVariants(selector().withBuildType("release")) { variant ->

        def flavorName = variant.productFlavors.isEmpty()
                ? "noflavor"
                : variant.productFlavors.collect { it.second }.join("-")

        def buildType = variant.buildType

        // Give each ABI split a distinct, ordered versionCode
        // (baseVersionCode * 10 + abiOffset) so a device/package manager can
        // tell them apart and correctly identify newer builds, and name each
        // output after its ABI so it's obvious which one to install.
        // Uses the real configured versionCode (e.g. from
        // defaultConfig.versionCode) rather than a hardcoded number, so this
        // doesn't silently go stale on the next version bump.
        //
        // Scoped to the release build type only: debug builds don't need
        // per-ABI output naming/versioning, and keeping this logic away from
        // debug removes any chance of it affecting everyday debug builds.
        def abiCodes = ["armeabi-v7a": 1, "arm64-v8a": 2, "x86": 3, "x86_64": 4]

        variant.outputs.forEach { output ->
            def abiFilter = output.filters.find { it.filterType == FilterType.ABI }?.identifier
            def abiSuffix = abiFilter ? "-${abiFilter}" : (variant.outputs.size() > 1 ? "-universal" : "")

            output.outputFileName.set(
                    "app-${buildType}-${flavorName}${abiSuffix}.apk"
            )

            if (abiFilter != null && abiCodes.containsKey(abiFilter)) {
                def baseVersionCode = output.versionCode.getOrElse(1)
                output.versionCode.set(baseVersionCode * 10 + abiCodes[abiFilter])
            }
        }
    }
}

