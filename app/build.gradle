    // integration steps and LlamaCppEngineBridge's class javadoc for the exact prerequisites.
    //
    // kotlinx-coroutines-android is still needed — LlamaCppEngineBridge uses the same
    // CoroutineScope(SupervisorJob() + Dispatchers.IO) pattern the old bridge did.
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"

    testImplementation "junit:junit:4.13.2"
