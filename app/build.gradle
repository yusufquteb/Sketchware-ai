// ── Desugared-library config for user-project dexing (readAllBytes() fix) ──
// WHY THIS EXISTS: app/src/main/java/mod/pranav/dependency/resolver/DependencyResolver.kt's
// compileJar() dexes a *user's* resolved dependency jars via a bare D8Command.builder() call with
// no desugared-library configuration attached. This app's own Gradle build has
// coreLibraryDesugaring enabled (see compileOptions above), which correctly
// desugars calls like InputStream.readAllBytes() in THIS APP's own code — but
// that has no effect on code D8 dexes at runtime for a *user's* project, since
// that's a separate, manually-constructed D8 invocation with its own (until now,
// absent) desugaring configuration. Result: a user's project containing (directly
// or via a linked library) a call to a Java 9+ API not present on their device's
// API level would dex successfully but crash at runtime with NoSuchMethodError —
// confirmed via a real-world report: building a project on an API 29 emulator.
//
// FIX: resolve the same com.android.tools:desugar_jdk_libs_configuration artifact
// AGP itself uses for this app's own build, extract its JSON spec, and stage it
// as a raw asset (app/src/main/assets/desugar_jdk_libs_configuration.json) so
// DependencyResolver.kt can read it at runtime (via the app Context's AssetManager,
// see its loadDesugaredLibraryConfigJson()) and pass it to
// D8Command.builder().addDesugaredLibraryConfiguration(String) — a public method
// confirmed present on BaseCompilerCommand.Builder (which D8Command.Builder
// extends) in the r8 versions this project depends on (8.11.18 / 8.13.17). This
// takes the String overload specifically so no direct reference to the
// com.android.tools.r8.StringResource type is needed at all.
//
// NOTE: this asset-staging Gradle task was added in an earlier session, but the actual
// D8Command.Builder call site was never updated to load and pass it — the fix was staged but not
// wired up, which is why the API 29 readAllBytes() crash still reproduced. Fixed this session by
// adding loadDesugaredLibraryConfigJson() and the addDesugaredLibraryConfiguration(...) call in
// DependencyResolver.kt's compileJar().
//
// The JSON is resolved from Maven at build time (not hand-copied into this repo)
// so it always matches the exact desugar_jdk_libs version this app depends on,
// and updates automatically if that version is ever bumped.
configurations {
    desugarConfigJson {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

dependencies {
    desugarConfigJson "com.android.tools:desugar_jdk_libs_configuration:2.1.5"
}

tasks.register('stageDesugaredLibraryConfigAsset') {
    def outputFile = file("src/main/assets/desugar_jdk_libs_configuration.json")
    def resolvedFiles = configurations.desugarConfigJson

    inputs.files(resolvedFiles)
    outputs.file(outputFile)

    doLast {
        def artifactFile = resolvedFiles.singleFile
        def foundEntry = false
        outputFile.parentFile.mkdirs()
        zipTree(artifactFile).matching { include "**/*.json" }.visit { details ->
            if (!details.isDirectory() && !foundEntry) {
                outputFile.bytes = details.file.bytes
                foundEntry = true
            }
        }
        if (!foundEntry) {
            throw new GradleException(
                "stageDesugaredLibraryConfigAsset: no .json entry found inside " +
                "com.android.tools:desugar_jdk_libs_configuration:2.1.5 (artifact: " +
                artifactFile + "). DexCompiler.java's readAllBytes() fix depends on " +
                "this file existing at src/main/assets/desugar_jdk_libs_configuration.json — " +
                "check whether the artifact's internal layout changed.")
        }
    }
}

preBuild.dependsOn stageDesugaredLibraryConfigAsset
