    // load-time parameter instead — see LlamaCppEngineBridge's class javadoc.
    //
    // NOT YET WIRED UP: this migration still needs the actual native engine module vendored in
    // (ggml-org/llama.cpp's examples/llama.android — a `:llama` Gradle module providing
