dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url = uri("https://jitpack.io") }
        maven { url = uri("https://s01.oss.sonatype.org/content/repositories/snapshots") }
    }
}

rootProject.name = "Sketchware Pro"
include(":app")

// llama.cpp's official Android JNI library (com.arm.aichat). The actual source lives in the
// third_party/llama.cpp git submodule (pinned to commit 571d0d5 / tag b10068); llama/ is a
// wrapper module of OUR OWN whose build.gradle points its sourceSets and CMake path into that
// submodule — see llama/build.gradle's header comment for the full trail of why the submodule's
// own build.gradle.kts cannot be used directly (plugins{}-vs-buildscript-classpath conflict,
// and ProjectDescriptor.buildFile being read-only, both confirmed by real sync failures).
include(":llama")
project(":llama").projectDir = file("llama")
