// Wrapper module for llama.cpp's official Android JNI library (com.arm.aichat).
//
// WHY THIS WRAPPER EXISTS (the root-cause trail, each step confirmed by a real Gradle sync
// failure on a real machine — see CHANGES.md Phase 6):
//   1. The actual source lives in the third_party/llama.cpp git submodule
//      (examples/llama.android/lib). Its own build.gradle.kts applies plugins via the
//      plugins{} / version-catalog DSL (libs.plugins.android.library), resolved against ITS
//      OWN gradle/libs.versions.toml — a separate Gradle build we don't include. Pointing
//      settings.gradle's projectDir at it failed: "Unresolved reference 'android'".
//   2. Adding matching aliases to our catalog then failed with
//      "InvalidPluginRequestException: the plugin is already on the classpath with an unknown
//      version" — Gradle refuses to reconcile a version-pinned plugins{} request against the
//      same plugin loaded via this project's legacy buildscript{} classpath (root build.gradle).
//   3. Redirecting the module to a replacement script via project(":llama").buildFile failed:
//      that property is READ-ONLY on ProjectDescriptor ("Cannot set readonly property:
//      buildFile"), and its writable sibling buildFileName is deprecated for removal in
//      Gradle 9 — a dead end, not worth building on.
//
// THE DURABLE FIX: this directory is a real module of OUR project with a normal build file in
// the same style as every other module here (Groovy + apply plugin:, plugin versions come from
// the root buildscript classpath — no plugins{} DSL, no catalog coupling, nothing readonly to
// fight). It contains no source of its own: sourceSets and externalNativeBuild below point
// into the submodule, both officially supported AGP mechanisms. The android{} content mirrors
// the submodule's own build.gradle.kts (pinned at commit 571d0d5 / tag b10068) — if the
// submodule is ever bumped, diff its build.gradle.kts against this file and port changes by
// hand.
//
// NOTE: CMakeLists.txt locates the llama.cpp/ggml source tree relative to ITS OWN location
// (${CMAKE_CURRENT_LIST_DIR}/../../../../../../), not relative to this module dir, so pointing
// at it from here is safe.

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

def llamaLibDir = file("$rootDir/third_party/llama.cpp/examples/llama.android/lib")

android {
    namespace = "com.arm.aichat"
    compileSdk = 36

    ndkVersion = "29.0.13113456"

    defaultConfig {
        minSdk = 33

        consumerProguardFiles "${llamaLibDir}/consumer-rules.pro"

        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
        externalNativeBuild {
            cmake {
                // 16 KB page size: forced globally via the CMake cache so every shared object
                // produced by this build is aligned, per Google's documented workaround:
                // https://developer.android.com/guide/practices/page-sizes#cmake
                //
                // APK size: GGML_CPU_ALL_VARIANTS=ON (the previous setting) makes ggml's own
                // CMakeLists add ~7 separate CPU-variant backend .so's per ABI on Android
                // (android_armv8.0_1 through android_armv9.2_2 for arm64-v8a; ~14 x86 variants
                // for x86_64 — see third_party/llama.cpp/ggml/src/CMakeLists.txt's
                // GGML_CPU_ALL_VARIANTS block), each its own add_library() — that's what
                // ballooned the arm64-v8a debug APK to ~330 MB. GGML_BACKEND_DL stays ON (the
                // native side still dlopen's the CPU backend .so by directory path at runtime
                // via ggml_backend_load_all_from_path in ai_chat.cpp — that mechanism works
                // identically whether there's one .so in the directory or seven), but we now
                // build ONE CPU backend per ABI instead of seven-to-fourteen:
                //   - arm64-v8a: GGML_CPU_ARM_ARCH pins a single -march baseline (armv8.2-a
                //     with dotprod+fp16 arithmetic) instead of iterating every ARM revision
                //     from armv8.0 to armv9.2 — armv8.2 covers the overwhelming majority of
                //     arm64 Android devices since ~2018 and is the same baseline ggml's own
                //     ALL_VARIANTS logic picks once DOTPROD+FP16_VECTOR_ARITHMETIC are enabled
                //     (see ggml-cpu/CMakeLists.txt's ARM GGML_CPU_ALL_VARIANTS branch).
                //   - x86_64: the individual GGML_SSE42/AVX/AVX2/F16C/FMA/BMI2 feature flags
                //     below select a single "haswell"-equivalent baseline (2013+ CPUs) instead
                //     of iterating from bare SSE4.2 up through AVX-512/AMX variants.
                // Devices/emulators below these baselines simply won't run the offline model —
                // an acceptable trade for a debug/direct-distribution APK (not Play Store,
                // where per-device delivery would otherwise pick the right split automatically).
                arguments "-DCMAKE_BUILD_TYPE=Release",
                        "-DCMAKE_MESSAGE_LOG_LEVEL=DEBUG",
                        "-DCMAKE_VERBOSE_MAKEFILE=ON",
                        "-DBUILD_SHARED_LIBS=ON",
                        "-DLLAMA_BUILD_APP=OFF",
                        "-DLLAMA_BUILD_COMMON=ON",
                        "-DLLAMA_OPENSSL=OFF",
                        "-DGGML_NATIVE=OFF",
                        "-DGGML_BACKEND_DL=ON",
                        "-DGGML_CPU_ALL_VARIANTS=OFF",
                        "-DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod+fp16",
                        "-DGGML_SSE42=ON",
                        "-DGGML_AVX=ON",
                        "-DGGML_AVX2=ON",
                        "-DGGML_F16C=ON",
                        "-DGGML_FMA=ON",
                        "-DGGML_BMI2=ON",
                        "-DGGML_LLAMAFILE=OFF",
                        "-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,max-page-size=16384",
                        "-DCMAKE_EXE_LINKER_FLAGS=-Wl,-z,max-page-size=16384"
            }
        }
        aarMetadata {
            minCompileSdk = 35
        }
    }

    externalNativeBuild {
        cmake {
            path "${llamaLibDir}/src/main/cpp/CMakeLists.txt"
            version "3.31.6"
        }
    }

    sourceSets {
        main {
            manifest.srcFile "${llamaLibDir}/src/main/AndroidManifest.xml"
            java.srcDirs = ["${llamaLibDir}/src/main/java"]
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    packagingOptions {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
        }
    }
}

dependencies {
    // Same coordinates/versions the submodule's own catalog declares (core-ktx 1.17.0,
    // datastore-preferences 1.2.0) — kept as direct strings since this wrapper deliberately
    // avoids coupling to any version catalog (see header).
    implementation "androidx.core:core-ktx:1.17.0"
    implementation "androidx.datastore:datastore-preferences:1.2.0"
}
